name: CD - Staging

on:
  workflow_dispatch:
  push:
    branches: ["staging"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-frontend:${{ env.IMAGE_TAG }}

      - name: Set up kubectl
        if: ${{ secrets.KUBE_CONFIG_STAGING != '' }}
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.29.0"

      - name: Deploy to staging
        if: ${{ secrets.KUBE_CONFIG_STAGING != '' }}
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 --decode > kubeconfig
          kubectl --kubeconfig kubeconfig apply -f infrastructure/kubernetes
