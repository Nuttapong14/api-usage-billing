apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: usage-log
  annotations:
    kubernetes.io/ingress.class: kong
plugin: usage-log
config:
  redis_host: redis.default.svc.cluster.local
  redis_port: 6379
  redis_password: ""
  stream_prefix: usage
  stream: requests
  max_len: 100000
