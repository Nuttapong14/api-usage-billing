global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: usage-service
    metrics_path: /metrics
    static_configs:
      - targets: ["usage-service:8081"]
