run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - staticcheck
    - typecheck
    - unused
    - ineffassign
    - gofmt
    - goimports
    - revive

linters-settings:
  revive:
    rules:
      - name: var-naming
      - name: indent-error-flow
      - name: empty-lines

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
